id: io.github.OnepointConsultingLtd.DriftFolderSync
# KDE runtime: provides Qt so the window uses your desktop's native style.
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: driftfoldersync
finish-args:
  # Talk to the Google Drive API and the OAuth endpoints.
  - --share=network
  # The settings and status window.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sync folders can live anywhere in your home directory; deleted files are
  # moved to your real ~/.local/share/Trash.
  - --filesystem=home
  # System tray icon (StatusNotifierItem) and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/driftfoldersync/cargo-home
    CARGO_NET_OFFLINE: 'true'
    # Draw widgets with Qt, i.e. the desktop's own style (Breeze on KDE).
    SLINT_STYLE: qt
modules:
  - name: driftfoldersync
    buildsystem: simple
    build-commands:
      # Use the crates vendored by flatpak/build.sh (no network during build).
      - mkdir -p cargo-home
      - printf '[source.crates-io]\nreplace-with = "vendored"\n[source.vendored]\ndirectory = "vendor"\n' > cargo-home/config.toml
      - cargo build --release --locked --offline
      - install -Dm755 target/release/driftfoldersync /app/bin/driftfoldersync
      - install -Dm644 data/io.github.OnepointConsultingLtd.DriftFolderSync.desktop /app/share/applications/io.github.OnepointConsultingLtd.DriftFolderSync.desktop
      - install -Dm644 data/io.github.OnepointConsultingLtd.DriftFolderSync.Open.desktop /app/share/applications/io.github.OnepointConsultingLtd.DriftFolderSync.Open.desktop
      - install -Dm644 data/io.github.OnepointConsultingLtd.DriftFolderSync.metainfo.xml /app/share/metainfo/io.github.OnepointConsultingLtd.DriftFolderSync.metainfo.xml
      - install -Dm644 data/io.github.OnepointConsultingLtd.DriftFolderSync.mime.xml /app/share/mime/packages/io.github.OnepointConsultingLtd.DriftFolderSync.xml
      - install -Dm644 data/icons/io.github.OnepointConsultingLtd.DriftFolderSync.svg /app/share/icons/hicolor/scalable/apps/io.github.OnepointConsultingLtd.DriftFolderSync.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.OnepointConsultingLtd.DriftFolderSync/LICENSE
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - flatpak/.flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
