name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        run: cargo test --locked

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to attach the bundle to a release
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $have"
            exit 1
          fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # Ubuntu 24.04 restricts unprivileged user namespaces, which the
          # Flatpak build sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache runtimes and build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            flatpak/.flatpak-builder
          key: flatpak-kde-6.11-${{ hashFiles('Cargo.lock', 'flatpak/*.yml') }}
          restore-keys: flatpak-kde-6.11-

      - name: Build
        run: |
          set -o pipefail
          ./flatpak/build.sh --bundle 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          msg="$(tail -n 40 build.log 2>/dev/null | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Flatpak build failed::${msg}"

      - name: Name the bundle
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          f="DriftFolderSync-${v}-x86_64.flatpak"
          mv driftfoldersync.flatpak "$f"
          sha256sum "$f" > "$f.sha256"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            # Once, so the KDE runtime can be fetched from Flathub:
            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user ${{ steps.name.outputs.file }}
            ```

            Then open **DriftFolderSync** from your application menu. See the
            [README](https://github.com/${{ github.repository }}#oauth-set-up) for the one-off OAuth set-up.
