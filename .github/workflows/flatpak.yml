name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        run: cargo test --locked

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    # Flathub's CI image: current flatpak-builder and the KDE 6.11 runtime.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    permissions:
      contents: write   # to attach the bundle to a release
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $have"
            exit 1
          fi

      - name: Name the bundle
        id: name
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then v="$GITHUB_REF_NAME"; else v="$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          echo "file=DriftFolderSync-${v}-x86_64.flatpak" >> "$GITHUB_OUTPUT"

      # The Flatpak build runs offline, so fetch the Rust crates first.
      - name: Vendor Rust crates
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          "$HOME/.cargo/bin/cargo" vendor --locked --versioned-dirs vendor > /dev/null

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.OnepointConsultingLtd.DriftFolderSync.yml
          bundle: ${{ steps.name.outputs.file }}
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'flatpak/*.yml') }}
          upload-artifact: true

      - name: Checksum
        run: sha256sum "${{ steps.name.outputs.file }}" > "${{ steps.name.outputs.file }}.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            # Once, so the KDE runtime can be fetched from Flathub:
            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user ${{ steps.name.outputs.file }}
            ```

            Then open **DriftFolderSync** from your application menu. See the
            [README](https://github.com/${{ github.repository }}#oauth-set-up) for the one-off OAuth set-up.
